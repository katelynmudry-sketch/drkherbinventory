name: Deploy Supabase Edge Functions

on:
  push:
    branches: [ main, claude/cloud-api-voice-commands-74gtvi ]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy voice-assistant
        run: supabase functions deploy voice-assistant --project-ref fyibctwovdussxizffgu
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
